<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f1d36"/>
    </linearGradient>
    <linearGradient id="rose-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-grad-2)" rx="16"/>

  <!-- Window chrome -->
  <rect x="70" y="50" width="660" height="400" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="70" y="50" width="660" height="45" rx="14" fill="#0f172a"/>
  <line x1="70" y1="95" x2="730" y2="95" stroke="#334155" stroke-width="1"/>
  
  <!-- Window dots -->
  <circle cx="100" cy="72" r="6" fill="#ef4444"/>
  <circle cx="120" cy="72" r="6" fill="#f59e0b"/>
  <circle cx="140" cy="72" r="6" fill="#10b981"/>
  <text x="360" y="77" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Hyperion UI Kit v2.4</text>

  <!-- Left Sidebar Mock -->
  <rect x="85" y="110" width="130" height="320" rx="8" fill="#0f172a" opacity="0.6"/>
  <rect x="100" y="130" width="80" height="12" rx="4" fill="#475569"/>
  <rect x="100" y="160" width="95" height="10" rx="4" fill="#334155"/>
  <rect x="100" y="185" width="70" height="10" rx="4" fill="#334155"/>
  <rect x="100" y="210" width="90" height="10" rx="4" fill="#6366f1"/>
  <rect x="100" y="235" width="65" height="10" rx="4" fill="#334155"/>
  <rect x="100" y="260" width="80" height="10" rx="4" fill="#334155"/>

  <!-- Main Content Showcase -->
  <!-- Card Component -->
  <g transform="translate(235, 115)">
    <rect width="220" height="145" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <rect x="15" y="15" width="40" height="40" rx="8" fill="url(#rose-glow)"/>
    <text x="65" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Metric Card</text>
    <text x="65" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Accessible Primitive</text>
    <rect x="15" y="75" width="190" height="16" rx="4" fill="#1e293b"/>
    <rect x="15" y="102" width="110" height="28" rx="6" fill="#6366f1"/>
    <text x="35" y="121" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Primary CTA</text>
  </g>

  <!-- Toggle & Form Elements -->
  <g transform="translate(480, 115)">
    <rect width="230" height="145" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="20" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Form Controls</text>
    <rect x="20" y="48" width="190" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="32" y="69" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">search components...</text>
    <!-- Switch -->
    <rect x="20" y="98" width="44" height="24" rx="12" fill="#10b981"/>
    <circle cx="52" cy="110" r="9" fill="#ffffff"/>
    <text x="75" y="114" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Dark mode active</text>
  </g>

  <!-- Data Table & Badges preview -->
  <g transform="translate(235, 280)">
    <rect width="475" height="145" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <rect x="20" y="20" width="80" height="24" rx="12" fill="#3b82f6" opacity="0.2"/>
    <text x="34" y="36" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Active</text>
    
    <rect x="110" y="20" width="80" height="24" rx="12" fill="#10b981" opacity="0.2"/>
    <text x="124" y="36" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Success</text>

    <rect x="200" y="20" width="90" height="24" rx="12" fill="#ec4899" opacity="0.2"/>
    <text x="214" y="36" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Warning</text>

    <!-- Code Line Mock -->
    <rect x="20" y="65" width="435" height="60" rx="8" fill="#111827"/>
    <text x="35" y="90" fill="#a78bfa" font-family="monospace" font-size="12">&lt;Button variant="primary" glow&gt;Deploy&lt;/Button&gt;</text>
    <text x="35" y="110" fill="#6ee7b7" font-family="monospace" font-size="12">export default HyperionProvider;</text>
  </g>
</svg>