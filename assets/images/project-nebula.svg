<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="chart-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-grad-3)" rx="16"/>

  <!-- Top bar -->
  <g transform="translate(60, 40)">
    <text x="0" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Nebula Telemetry Engine</text>
    <text x="0" y="44" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Cluster: us-west-2 • 12 Nodes Online</text>
    <rect x="570" y="10" width="110" height="30" rx="15" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <circle cx="585" cy="25" r="4" fill="#10b981"/>
    <text x="597" y="29" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LIVE FEED</text>
  </g>

  <!-- Big Wave Chart Area -->
  <g transform="translate(60, 110)">
    <rect width="680" height="200" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Grid Lines -->
    <line x1="20" y1="50" x2="660" y2="50" stroke="#1e293b" stroke-dasharray="4,4"/>
    <line x1="20" y1="100" x2="660" y2="100" stroke="#1e293b" stroke-dasharray="4,4"/>
    <line x1="20" y1="150" x2="660" y2="150" stroke="#1e293b" stroke-dasharray="4,4"/>

    <!-- Chart path area -->
    <path d="M 20 160 Q 80 140, 140 90 T 260 110 T 380 60 T 500 100 T 620 40 L 660 50 L 660 180 L 20 180 Z" fill="url(#chart-fill)" />
    <!-- Chart Stroke line -->
    <path d="M 20 160 Q 80 140, 140 90 T 260 110 T 380 60 T 500 100 T 620 40 L 660 50" fill="none" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Data points -->
    <circle cx="380" cy="60" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <rect x="340" y="25" width="80" height="24" rx="6" fill="#020617" stroke="#38bdf8" stroke-width="1"/>
    <text x="350" y="41" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">42.8k req/s</text>

    <!-- Secondary line -->
    <path d="M 20 170 Q 100 160, 200 130 T 400 140 T 600 110 L 660 105" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,3" opacity="0.8"/>
  </g>

  <!-- 3 Stat Cards below -->
  <g transform="translate(60, 330)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="210" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Avg Query Latency</text>
    <text x="20" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="700">4.2 ms</text>
    <text x="20" y="92" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">↓ 32% vs last release</text>

    <!-- Card 2 -->
    <rect x="235" y="0" width="210" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="255" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Ingestion Throughput</text>
    <text x="255" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="700">142k/s</text>
    <text x="255" y="92" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">↑ 18% peak volume</text>

    <!-- Card 3 -->
    <rect x="470" y="0" width="210" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="490" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Error Rate (5xx)</text>
    <text x="490" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="700">0.001%</text>
    <text x="490" y="92" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Healthy SLA</text>
  </g>
</svg>