<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="stream-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-grad-6)" rx="16"/>

  <!-- Centered Message Hub Gateway -->
  <g transform="translate(400, 240)">
    <circle cx="0" cy="0" r="85" fill="#1e1b4b" stroke="url(#stream-accent)" stroke-width="3"/>
    <circle cx="0" cy="0" r="60" fill="#0f172a"/>
    <text x="0" y="-8" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">EchoStream</text>
    <text x="0" y="14" fill="#a78bfa" font-family="monospace" font-size="11" text-anchor="middle">Core Broker</text>
    <text x="0" y="32" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">250k msgs/s</text>
  </g>

  <!-- Flowing stream lines -->
  <path d="M 80 140 C 220 140, 260 210, 315 230" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="8,5"/>
  <path d="M 80 340 C 220 340, 260 270, 315 250" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="8,5"/>
  
  <path d="M 485 230 C 540 210, 580 140, 720 140" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="8,5"/>
  <path d="M 485 250 C 540 270, 580 340, 720 340" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="8,5"/>

  <!-- Input nodes -->
  <g transform="translate(40, 110)">
    <rect width="130" height="60" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="18" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">IoT Sensor Array</text>
    <text x="18" y="46" fill="#f472b6" font-family="monospace" font-size="11">MQTT :1883</text>
  </g>

  <g transform="translate(40, 310)">
    <rect width="130" height="60" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="18" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Client WebSockets</text>
    <text x="18" y="46" fill="#c084fc" font-family="monospace" font-size="11">WSS :443</text>
  </g>

  <!-- Output nodes -->
  <g transform="translate(630, 110)">
    <rect width="130" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="18" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Kafka Topic Cluster</text>
    <text x="18" y="46" fill="#60a5fa" font-family="monospace" font-size="11">Partition [0..15]</text>
  </g>

  <g transform="translate(630, 310)">
    <rect width="130" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="18" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Time-series DB</text>
    <text x="18" y="46" fill="#34d399" font-family="monospace" font-size="11">ClickHouse Sink</text>
  </g>
</svg>