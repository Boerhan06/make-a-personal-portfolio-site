<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-grad-4)" rx="16"/>

  <!-- Toolbar at top -->
  <g transform="translate(250, 30)">
    <rect width="300" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="35" cy="21" r="12" fill="#6366f1"/>
    <circle cx="75" cy="21" r="12" fill="#334155"/>
    <circle cx="115" cy="21" r="12" fill="#334155"/>
    <circle cx="155" cy="21" r="12" fill="#334155"/>
    <circle cx="195" cy="21" r="12" fill="#334155"/>
    <circle cx="235" cy="21" r="12" fill="#334155"/>
    <circle cx="275" cy="21" r="12" fill="#10b981"/>
  </g>

  <!-- Vector Shapes on Canvas -->
  <g transform="translate(140, 120)">
    <!-- Vector wireframe art -->
    <polygon points="160,20 280,240 40,240" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8,4"/>
    <circle cx="160" cy="140" r="70" fill="#6366f1" fill-opacity="0.3" stroke="#818cf8" stroke-width="3"/>
    
    <!-- Vector Anchor Points -->
    <rect x="156" y="16" width="8" height="8" fill="#ffffff" stroke="#38bdf8"/>
    <rect x="276" y="236" width="8" height="8" fill="#ffffff" stroke="#38bdf8"/>
    <rect x="36" y="236" width="8" height="8" fill="#ffffff" stroke="#38bdf8"/>
    <rect x="156" y="66" width="8" height="8" fill="#ffffff" stroke="#818cf8"/>
    <rect x="156" y="206" width="8" height="8" fill="#ffffff" stroke="#818cf8"/>
  </g>

  <!-- Collaborative Cursors -->
  <!-- Cursor 2 (Burhan) -->
  <g transform="translate(420, 210)">
    <path d="M 0 0 L 16 16 L 8 18 L 12 28 L 8 30 L 4 20 L 0 24 Z" fill="#ec4899"/>
    <rect x="16" y="18" width="60" height="22" rx="4" fill="#ec4899"/>
    <text x="22" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Sarah (UX)</text>
  </g>

  <!-- Cursor 2 -->
  <g transform="translate(240, 290)">
    <path d="M 0 0 L 16 16 L 8 18 L 12 28 L 8 30 L 4 20 L 0 24 Z" fill="#10b981"/>
    <rect x="16" y="18" width="80" height="22" rx="4" fill="#10b981"/>
    <text x="22" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Burhan (Wasm)</text>
  </g>

  <!-- Properties Panel Floating on Right -->
  <g transform="translate(560, 110)">
    <rect width="180" height="280" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.95"/>
    <text x="20" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Inspector</text>
    <line x1="15" y1="46" x2="165" y2="46" stroke="#1e293b"/>
    <text x="20" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Width</text>
    <rect x="20" y="76" width="140" height="26" rx="4" fill="#1e293b"/>
    <text x="30" y="94" fill="#f8fafc" font-family="monospace" font-size="11">840 px</text>

    <text x="20" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Fill Color</text>
    <rect x="20" y="133" width="140" height="26" rx="4" fill="#1e293b"/>
    <circle cx="32" cy="146" r="6" fill="#6366f1"/>
    <text x="46" y="150" fill="#f8fafc" font-family="monospace" font-size="11">#6366F1</text>

    <rect x="20" y="210" width="140" height="34" rx="8" fill="#3b82f6"/>
    <text x="45" y="232" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Export SVG</text>
  </g>
</svg>