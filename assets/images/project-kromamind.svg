<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-grad-5)" rx="16"/>

  <!-- Local AI Chat window -->
  <g transform="translate(100, 60)">
    <rect width="600" height="380" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Header -->
    <rect width="600" height="50" rx="14" fill="#064e3b" fill-opacity="0.4"/>
    <circle cx="30" cy="25" r="7" fill="#10b981"/>
    <text x="50" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">KromaMind Local LLM (Llama-3-8B 4-bit)</text>
    <rect x="470" y="14" width="105" height="24" rx="12" fill="#10b981" fill-opacity="0.2"/>
    <text x="482" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">🔒 100% Offline</text>

    <!-- Message 1 (User) -->
    <g transform="translate(140, 75)">
      <rect width="430" height="48" rx="12" fill="#1e293b"/>
      <text x="20" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Analyze my quarterly financial PDF and summarize anomalies.</text>
    </g>

    <!-- Message 2 (Assistant with RAG citations) -->
    <g transform="translate(30, 140)">
      <rect width="520" height="150" rx="12" fill="#134e4a" fill-opacity="0.3" stroke="#14b8a6" stroke-width="1"/>
      <text x="20" y="28" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✦ Kroma Assistant (Vector Matches: 4 chunks)</text>
      <text x="20" y="55" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">Identified 2 budget variances in Section 4.2:</text>
      <text x="35" y="80" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="12">• Infrastructure cloud spend increased 14.2% MoM</text>
      <text x="35" y="102" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="12">• Client onboarding turnaround dropped to 1.4 days</text>
      <rect x="20" y="118" width="180" height="22" rx="6" fill="#042f2e"/>
      <text x="28" y="133" fill="#2dd4bf" font-family="monospace" font-size="10">Source: Q3_Financials.pdf#p12</text>
    </g>

    <!-- Input bar -->
    <g transform="translate(30, 310)">
      <rect width="540" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
      <text x="24" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Ask anything about your local documents...</text>
      <circle cx="505" cy="23" r="16" fill="#10b981"/>
      <path d="M 500 23 L 510 18 L 510 28 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>