<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg-grad-1)" rx="16"/>

  <!-- Subtle Grid -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <path d="M 0 50 H 800 M 0 100 H 800 M 0 150 H 800 M 0 200 H 800 M 0 250 H 800 M 0 300 H 800 M 0 350 H 800 M 0 400 H 800 M 0 450 H 800" />
    <path d="M 50 0 V 500 M 100 0 V 500 M 150 0 V 500 M 200 0 V 500 M 250 0 V 500 M 300 0 V 500 M 350 0 V 500 M 400 0 V 500 M 450 0 V 500 M 500 0 V 500 M 550 0 V 500 M 600 0 V 500 M 650 0 V 500 M 700 0 V 500 M 750 0 V 500" />
  </g>

  <!-- Ambient light -->
  <circle cx="400" cy="240" r="160" fill="#6366f1" opacity="0.12" filter="url(#glow1)"/>
  <circle cx="600" cy="180" r="120" fill="#06b6d4" opacity="0.1" filter="url(#glow1)"/>

  <!-- Workflow Graph Connections -->
  <path d="M 220 250 C 290 250, 310 180, 380 180" fill="none" stroke="url(#cyan-glow)" stroke-width="3" opacity="0.8" stroke-dasharray="6,4"/>
  <path d="M 220 250 C 290 250, 310 320, 380 320" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.8"/>
  <path d="M 500 180 C 560 180, 580 250, 640 250" fill="none" stroke="url(#cyan-glow)" stroke-width="3" opacity="0.8"/>
  <path d="M 500 320 C 560 320, 580 250, 640 250" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.8"/>

  <!-- Node 1: Input -->
  <g transform="translate(100, 210)">
    <rect width="130" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="8" fill="#10b981"/>
    <text x="42" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Event Hook</text>
    <text x="25" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Webhook listener</text>
    <circle cx="130" cy="40" r="5" fill="#06b6d4"/>
  </g>

  <!-- Node 2: LLM Agent -->
  <g transform="translate(370, 140)">
    <rect width="140" height="80" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#glow1)"/>
    <circle cx="25" cy="25" r="8" fill="#6366f1"/>
    <text x="42" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">AI Reasoning</text>
    <text x="25" y="55" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11">GPT-4o / Claude</text>
    <circle cx="0" cy="40" r="5" fill="#6366f1"/>
    <circle cx="140" cy="40" r="5" fill="#06b6d4"/>
  </g>

  <!-- Node 3: Vector Search -->
  <g transform="translate(370, 280)">
    <rect width="140" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="8" fill="#f59e0b"/>
    <text x="42" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Vector RAG</text>
    <text x="25" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Cosine match</text>
    <circle cx="0" cy="40" r="5" fill="#6366f1"/>
    <circle cx="140" cy="40" r="5" fill="#8b5cf6"/>
  </g>

  <!-- Node 4: Action/Output -->
  <g transform="translate(630, 210)">
    <rect width="130" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="8" fill="#06b6d4"/>
    <text x="42" y="29" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Execution</text>
    <text x="25" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Deploy payload</text>
    <circle cx="0" cy="40" r="5" fill="#06b6d4"/>
  </g>

  <!-- Badge at bottom right -->
  <g transform="translate(320, 430)">
    <rect width="160" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#10b981"/>
    <text x="34" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Live Orchestration</text>
  </g>
</svg>